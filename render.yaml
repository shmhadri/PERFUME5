services:
  - type: web
    name: tolaty-store
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    headers:
      # --- Security ---
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=(), payment=(), usb=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Everything the page needs is same-origin (fonts included), so the policy
      # can stay tight. Styles need 'unsafe-inline' only because React sets a few
      # inline style attributes (the free-shipping progress bar).
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          font-src 'self';
          img-src 'self' data:;
          connect-src 'self';
          form-action 'self';
          frame-ancestors 'none';
          base-uri 'self';
          object-src 'none';
          upgrade-insecure-requests

      # --- Caching: hashed build assets never change, so cache them hard ---
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
